name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    name: API tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trello_clone_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Audit (security-guardrails.md)
        run: npm audit --audit-level=high
      - name: Run integration tests
        run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/trello_clone_test

  client-build:
    name: Client lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Audit (security-guardrails.md)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  # CD: Vercel (client) and Render (server) auto-deploy from main via their
  # native GitHub integrations once connected — see docs/deployment-guide.md.
  # This job is the gate: a red CI run blocks the merge that would deploy.
